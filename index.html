<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Project Module Dashboard - Track development progress across all modules">
    <title>Project Module Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Ambient background blobs -->
        <div class="ambient-bg">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <!-- Header -->
        <header class="header" id="main-header">
            <div class="header-content">
                <div class="header-left">
                    <button class="back-btn hidden" id="back-btn" onclick="showLanding()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        <span>All Modules</span>
                    </button>
                    <h1 class="logo" id="page-title">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2"><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6366f1"/><stop offset="100%" style="stop-color:#06b6d4"/></linearGradient></defs><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                        Project Dashboard
                    </h1>
                </div>
                <div class="header-right">
                    <div class="header-stats" id="header-stats"></div>
                    <button class="back-btn" id="pres-toggle-btn" onclick="togglePresentationMode()" style="background: rgba(99, 102, 241, 0.12); color: #4f46e5; border-color: rgba(99, 102, 241, 0.25); margin-right: 8px;">
                        <span>🎬 Presentation Mode</span>
                    </button>
                    <button class="upload-btn" id="upload-btn" onclick="openUploadModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; vertical-align: middle;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                        <span>Upload Sheet</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Landing Page -->
        <main class="landing-page" id="landing-page">
            <div class="landing-hero">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h2 class="hero-title">Module Overview</h2>
                        <p class="hero-subtitle">Click on any module to view detailed progress and status</p>
                    </div>
                    <button class="upload-btn" id="team-review-btn" onclick="showTeamReview()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px; vertical-align: middle;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <span>Team Review</span>
                    </button>
                </div>
            </div>
            <div class="modules-grid" id="modules-grid"></div>
        </main>

        <!-- Module Detail Page -->
        <main class="detail-page hidden" id="detail-page">
            <div class="detail-header" id="detail-header"></div>
            <nav class="tabs-nav" id="tabs-nav"></nav>
            <div class="tab-content" id="tab-content"></div>
        </main>

        <!-- Team Review Standalone Page -->
        <main class="team-page hidden" id="team-page">
            <div class="landing-hero" style="margin-bottom: 2rem;">
                <h2 class="hero-title">Team Review</h2>
                <p class="hero-subtitle">Overall performance metrics and KPIs for the development team</p>
            </div>
            <div id="team-page-content" class="team-page-content"></div>
        </main>

        <!-- Presentation Slide Deck Page -->
        <main class="presentation-page hidden" id="presentation-page">
            <div class="presentation-slide" id="presentation-slide-container">
                <!-- Slide content will be rendered here dynamically -->
            </div>
            <div class="presentation-controls">
                <button class="pres-btn" id="pres-prev-btn" onclick="prevSlide()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                    <span>Previous</span>
                </button>
                <div class="pres-dots" id="pres-dots"></div>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <button class="upload-btn" id="pres-upload-btn" onclick="openUploadModal()" style="background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); color: white; border: none; padding: 0.4rem 0.9rem; border-radius: var(--radius-md); font-family: var(--font); font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.35rem; transition: var(--transition);">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                        <span>Upload Sheet</span>
                    </button>
                    <button class="pres-btn" id="pres-dashboard-btn" onclick="togglePresentationMode()" style="background: rgba(16, 185, 129, 0.12); color: #10b981; border-color: rgba(16, 185, 129, 0.25);">
                        <span>📊 Dashboard Mode</span>
                    </button>
                    <button class="pres-btn" id="pres-next-btn" onclick="nextSlide()">
                        <span>Next</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- Upload Modal -->
        <div class="modal-overlay" id="upload-modal">
            <div class="modal-container">
                <div class="modal-header">
                    <h3 class="modal-title">Upload Project Sheet</h3>
                    <button class="modal-close" onclick="closeUploadModal()">&times;</button>
                </div>
                <div class="dropzone" id="dropzone">
                    <div class="dropzone-icon">📁</div>
                    <div class="dropzone-text">Drag & drop your Excel file here or <strong>browse</strong></div>
                    <div class="dropzone-subtext">Supports .xlsx, .xls, .csv files</div>
                </div>
                <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display: none;">
                
                <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; gap: 1rem;">
                    <button class="back-btn" onclick="resetToDefault()" style="border-color: rgba(239, 68, 68, 0.25); color: #f43f5e;">
                        Reset to Default
                    </button>
                    <button class="back-btn" onclick="closeUploadModal()">
                        Close
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast Notification Container -->
        <div class="toast-container" id="toast-container"></div>
    </div>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
