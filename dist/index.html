<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Project Module Dashboard - Track development progress across all modules">
    <title>Project Module Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
/* ============================================
   Design System & CSS Variables
   ============================================ */
:root {
    --bg-primary: #f8fafc;
    --bg-secondary: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.75);
    --bg-card-hover: rgba(255, 255, 255, 0.95);
    --bg-glass: rgba(15, 23, 42, 0.03);
    --bg-glass-hover: rgba(15, 23, 42, 0.05);

    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;

    --border-subtle: rgba(15, 23, 42, 0.06);
    --border-accent: rgba(99, 102, 241, 0.25);

    --color-done: #16a34a;
    --color-done-bg: rgba(22, 163, 74, 0.08);
    --color-progress: #d97706;
    --color-progress-bg: rgba(217, 119, 6, 0.08);
    --color-pending: #ea580c;
    --color-pending-bg: rgba(234, 88, 12, 0.08);
    --color-not-done: #dc2626;
    --color-not-done-bg: rgba(220, 38, 38, 0.08);
    --color-skipped: #4b5563;
    --color-skipped-bg: rgba(75, 85, 99, 0.08);
    --color-bug: #e11d48;
    --color-bug-bg: rgba(225, 29, 72, 0.08);
    --color-approved: #059669;
    --color-approved-bg: rgba(5, 150, 105, 0.08);
    --color-na: #475569;
    --color-na-bg: rgba(71, 85, 105, 0.08);

    --module-preksha: #4f46e5;
    --module-samadhan: #059669;
    --module-expenditure: #d97706;
    --module-sugamta: #e11d48;
    --module-ipbms: #7c3aed;
    --module-evm: #0891b2;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 20px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 10px 30px rgba(15, 23, 42, 0.08);

    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ============================================
   Reset & Base
   ============================================ */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: var(--font);
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

#app {
    position: relative;
    min-height: 100vh;
}

/* ============================================
   Ambient Background
   ============================================ */
.ambient-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.06;
    animation: float 20s ease-in-out infinite;
}

.blob-1 {
    width: 600px;
    height: 600px;
    background: var(--module-preksha);
    top: -200px;
    left: -100px;
    animation-delay: 0s;
}

.blob-2 {
    width: 500px;
    height: 500px;
    background: var(--module-evm);
    bottom: -150px;
    right: -100px;
    animation-delay: -7s;
}

.blob-3 {
    width: 400px;
    height: 400px;
    background: var(--module-sugamta);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: -14s;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(30px, -30px) scale(1.05); }
    50% { transform: translate(-20px, 20px) scale(0.95); }
    75% { transform: translate(10px, 10px) scale(1.02); }
}

/* ============================================
   Header
   ============================================ */
.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 0 2rem;
}

.header-content {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.back-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg-glass);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    padding: 0.4rem 1rem;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-family: var(--font);
    font-size: 0.85rem;
    font-weight: 500;
    transition: var(--transition);
}

.back-btn:hover {
    background: var(--bg-glass-hover);
    color: var(--text-primary);
    border-color: var(--border-accent);
}

.header-stats {
    display: flex;
    gap: 1.5rem;
    font-size: 0.8rem;
    color: var(--text-muted);
}

.header-stat {
    display: flex;
    align-items: center;
    gap: 0.4rem;
}

.header-stat .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}

.hidden {
    display: none !important;
}

/* ============================================
   Landing Page
   ============================================ */
.landing-page, .detail-page {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem;
}

.landing-hero {
    text-align: center;
    padding: 2rem 0 2.5rem;
}

.hero-title {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
}

.hero-subtitle {
    color: var(--text-muted);
    font-size: 1rem;
    font-weight: 400;
}

/* ============================================
   Module Cards Grid
   ============================================ */
.modules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 1.5rem;
}

.module-card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 1.75rem;
    cursor: pointer;
    transition: var(--transition);
    overflow: hidden;
}

.module-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius-xl);
    padding: 1px;
    background: linear-gradient(135deg, var(--accent) 0%, transparent 50%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.4s ease;
}

.module-card:hover::before {
    opacity: 1;
}

.module-card:hover {
    transform: translateY(-4px);
    background: var(--bg-card-hover);
    box-shadow: var(--shadow-lg), 0 0 40px -10px var(--accent-glow);
}

.module-card .card-accent {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0.8;
}

.module-card .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 1.25rem;
}

.module-card .card-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
}

.module-card .card-status {
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.module-card .card-title {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.3rem;
}

.module-card .card-desc {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 1.25rem;
    line-height: 1.5;
}

.module-card .card-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem;
    margin-bottom: 1.25rem;
}

.module-card .stat-item {
    text-align: center;
    padding: 0.6rem;
    background: var(--bg-glass);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-subtle);
}

.module-card .stat-value {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-primary);
}

.module-card .stat-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 0.15rem;
}

.module-card .card-progress {
    margin-bottom: 1rem;
}

.progress-bar {
    height: 6px;
    background: rgba(15, 23, 42, 0.08);
    border-radius: 999px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--bg-secondary)));
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 0.4rem;
}

.module-card .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 1rem;
    border-top: 1px solid var(--border-subtle);
}

.module-card .team-avatars {
    display: flex;
    gap: 0;
}

.team-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 600;
    color: #fff;
    border: 2px solid var(--bg-card);
    margin-left: -6px;
}

.team-avatar:first-child {
    margin-left: 0;
}

.module-card .time-badge {
    font-size: 0.72rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 0.3rem;
}

/* ============================================
   Detail Page
   ============================================ */
.detail-page {
    animation: fadeInUp 0.4s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.detail-header {
    display: flex;
    align-items: flex-start;
    gap: 1.5rem;
    padding: 1.5rem 0 1.5rem;
    flex-wrap: wrap;
}

.detail-module-icon {
    width: 56px;
    height: 56px;
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 800;
    flex-shrink: 0;
}

.detail-info {
    flex: 1;
    min-width: 200px;
}

.detail-title {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 0.3rem;
}

.detail-meta {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
}

.meta-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
}

.meta-item svg {
    opacity: 0.5;
}

.detail-summary-cards {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-left: auto;
}

.summary-card {
    background: var(--bg-glass);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 0.75rem 1.25rem;
    text-align: center;
    min-width: 100px;
}

.summary-card .sc-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
}

.summary-card .sc-value {
    font-size: 0.9rem;
    font-weight: 600;
}

/* ============================================
   Tabs
   ============================================ */
.tabs-nav {
    display: flex;
    gap: 0.25rem;
    padding: 0.3rem;
    background: var(--bg-glass);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    margin-bottom: 1.5rem;
    overflow-x: auto;
    scrollbar-width: none;
}

.tabs-nav::-webkit-scrollbar {
    display: none;
}

.tab-btn {
    padding: 0.6rem 1.2rem;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font);
    font-size: 0.8rem;
    font-weight: 500;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
    position: relative;
}

.tab-btn:hover {
    color: var(--text-secondary);
    background: rgba(15, 23, 42, 0.015);
}

.tab-btn.active {
    background: rgba(15, 23, 42, 0.08);
    color: var(--text-primary);
    font-weight: 600;
}

.tab-btn .tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.12);
    font-size: 0.65rem;
    margin-left: 0.4rem;
    padding: 0 0.3rem;
}

/* ============================================
   Tab Content
   ============================================ */
.tab-content {
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Overview Section */
.overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.info-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    transition: var(--transition);
}

.info-card:hover {
    border-color: var(--border-accent);
}

.info-card .ic-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
}

.info-card .ic-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
}

.info-card .ic-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.info-card .ic-body {
    font-size: 0.85rem;
    color: var(--text-primary);
    line-height: 1.6;
}

.info-card .ic-body p {
    margin-bottom: 0.4rem;
}

.info-card .ic-body .label {
    color: var(--text-muted);
    font-size: 0.75rem;
}

/* ============================================
   Data Tables
   ============================================ */
.table-section {
    margin-bottom: 1.5rem;
}

.section-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border-subtle);
}

.section-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    background: var(--bg-glass);
    border: 1px solid var(--border-subtle);
}

.section-title {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
}

.section-subtitle {
    font-size: 0.75rem;
    color: var(--text-muted);
}

.user-type-group {
    margin-bottom: 2rem;
}

.user-type-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
    padding: 0.6rem 1rem;
    background: var(--bg-glass);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
}

.user-type-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    background: rgba(99, 102, 241, 0.15);
    color: #818cf8;
}

.user-type-name {
    font-size: 0.85rem;
    font-weight: 600;
}

.user-type-count {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-left: auto;
}

.category-group {
    margin-bottom: 1.25rem;
    margin-left: 1rem;
}

.category-label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.5rem;
    padding-left: 0.5rem;
    border-left: 2px solid var(--border-subtle);
}

.data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.8rem;
}

.data-table thead th {
    background: rgba(15, 23, 42, 0.015);
    padding: 0.6rem 0.75rem;
    text-align: left;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border-subtle);
    white-space: nowrap;
    position: sticky;
    top: 64px;
    z-index: 5;
}

.data-table thead th:first-child {
    border-radius: var(--radius-sm) 0 0 0;
}

.data-table thead th:last-child {
    border-radius: 0 var(--radius-sm) 0 0;
}

.data-table tbody tr {
    transition: var(--transition);
}

.data-table tbody tr:hover {
    background: rgba(255, 255, 255, 0.02);
}

.data-table tbody td {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid rgba(15, 23, 42, 0.05);
    vertical-align: top;
    color: var(--text-secondary);
    line-height: 1.5;
}

.data-table tbody td:first-child {
    color: var(--text-primary);
    font-weight: 500;
    max-width: 260px;
}

.data-table th.text-center,
.data-table td.text-center {
    text-align: center;
}

.data-table th.text-right,
.data-table td.text-right {
    text-align: right;
}

.col-status {
    width: 180px;
}

.col-review {
    width: 30%;
    min-width: 220px;
}

.data-table .page-name {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.page-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
}

/* ============================================
   Status Badges
   ============================================ */
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
    white-space: nowrap;
}

.status-done {
    color: var(--color-done);
    background: var(--color-done-bg);
}

.status-approved {
    color: var(--color-approved);
    background: var(--color-approved-bg);
}

.status-progress {
    color: var(--color-progress);
    background: var(--color-progress-bg);
}

.status-pending {
    color: var(--color-pending);
    background: var(--color-pending-bg);
}

.status-not-done {
    color: var(--color-not-done);
    background: var(--color-not-done-bg);
}

.status-skipped {
    color: var(--color-skipped);
    background: var(--color-skipped-bg);
}

.status-bug {
    color: var(--color-bug);
    background: var(--color-bug-bg);
}

.status-na {
    color: var(--text-muted);
    background: var(--color-na-bg);
}

.review-text {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.3rem;
    line-height: 1.4;
    max-width: 300px;
}

/* ============================================
   Team Section
   ============================================ */
.team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
}

.team-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    transition: var(--transition);
}

.team-card:hover {
    border-color: var(--border-accent);
    transform: translateY(-2px);
}

.team-card-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border-subtle);
}

.team-avatar-lg {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 700;
    color: #fff;
}

.team-name {
    font-size: 1rem;
    font-weight: 600;
}

.team-role {
    font-size: 0.72rem;
    color: var(--text-muted);
}

.team-fields {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
}

.team-field {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0.6rem;
    background: var(--bg-glass);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-subtle);
}

.team-field-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 500;
}

.team-field-value {
    font-size: 0.72rem;
    font-weight: 600;
}

/* ============================================
   Documentation Section
   ============================================ */
.doc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
}

.doc-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    text-align: center;
    transition: var(--transition);
}

.doc-card:hover {
    border-color: var(--border-accent);
}

.doc-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 0.75rem;
    font-size: 1.2rem;
}

.doc-title {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
}

/* ============================================
   Change Request Cards
   ============================================ */
.cr-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-bottom: 0.75rem;
    transition: var(--transition);
}

.cr-card:hover {
    border-color: var(--border-accent);
}

.cr-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
}

.cr-page {
    font-size: 0.85rem;
    font-weight: 600;
}

.cr-user-type {
    font-size: 0.7rem;
    color: var(--text-muted);
    background: var(--bg-glass);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
}

.cr-details {
    font-size: 0.8rem;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 0.75rem;
    padding: 0.75rem;
    background: var(--bg-glass);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--color-progress);
}

.cr-statuses {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
}

.cr-status-item {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
}

.cr-status-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

/* ============================================
   Empty State
   ============================================ */
.empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-muted);
}

.empty-state svg {
    margin-bottom: 1rem;
    opacity: 0.3;
}

.empty-state p {
    font-size: 0.9rem;
}

/* ============================================
   Scrollbar
   ============================================ */
::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(15, 23, 42, 0.1);
    border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(15, 23, 42, 0.2);
}

/* ============================================
   Responsive
   ============================================ */
@media (max-width: 768px) {
    .landing-page, .detail-page {
        padding: 1rem;
    }

    .modules-grid {
        grid-template-columns: 1fr;
    }

    .hero-title {
        font-size: 1.6rem;
    }

    .detail-header {
        flex-direction: column;
    }

    .detail-summary-cards {
        margin-left: 0;
    }

    .data-table {
        font-size: 0.72rem;
    }

    .tabs-nav {
        border-radius: var(--radius-md);
    }

    .tab-btn {
        padding: 0.5rem 0.8rem;
        font-size: 0.72rem;
    }

    .overview-grid {
        grid-template-columns: 1fr;
    }

    .header-stats {
        display: none;
    }
}

/* ============================================
   Tooltip
   ============================================ */
.tooltip-trigger {
    position: relative;
    cursor: help;
    border-bottom: 1px dotted var(--text-muted);
}

.tooltip-trigger:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: #ffffff;
    font-size: 0.72rem;
    padding: 0.5rem 0.75rem;
    border-radius: var(--radius-sm);
    white-space: normal;
    width: max-content;
    max-width: 280px;
    z-index: 50;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-subtle);
    line-height: 1.4;
}

/* ============================================
   Dependency/Blocker alert style
   ============================================ */
.alert-card {
    background: rgba(249, 115, 22, 0.06);
    border: 1px solid rgba(249, 115, 22, 0.2);
    border-radius: var(--radius-md);
    padding: 1rem;
    margin-top: 0.75rem;
}

.alert-card.alert-info {
    background: rgba(99, 102, 241, 0.06);
    border-color: rgba(99, 102, 241, 0.2);
}

.alert-card .alert-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--color-pending);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.4rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
}

.alert-card.alert-info .alert-title {
    color: #818cf8;
}

.alert-card .alert-body {
    font-size: 0.8rem;
    color: var(--text-secondary);
    line-height: 1.5;
}

/* Responsive grid for displaying user types side by side */
.user-types-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 1.5rem;
    align-items: start;
    margin-top: 1rem;
}

.user-types-grid .user-type-group {
    margin-bottom: 0;
}

/* ============================================
   Upload Button & Modal CSS
   ============================================ */
.header-right {
    display: flex;
    align-items: center;
    gap: 1.5rem;
}

.upload-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(6, 182, 212, 0.12));
    border: 1px solid rgba(99, 102, 241, 0.25);
    color: var(--text-primary);
    padding: 0.45rem 1rem;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-family: var(--font);
    font-size: 0.85rem;
    font-weight: 500;
    transition: var(--transition);
}

.upload-btn:hover {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(6, 182, 212, 0.22));
    border-color: rgba(99, 102, 241, 0.45);
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.15);
}

.upload-btn svg {
    stroke: #818cf8;
}

/* Upload Modal Overlay */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.3);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.modal-container {
    background: var(--bg-secondary);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    width: 90%;
    max-width: 500px;
    padding: 2rem;
    box-shadow: var(--shadow-lg);
    transform: scale(0.95);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
}

.modal-overlay.active .modal-container {
    transform: scale(1);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
}

.modal-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
}

.modal-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 1.5rem;
    padding: 0.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.modal-close:hover {
    color: var(--text-primary);
}

.dropzone {
    border: 2px dashed var(--border-accent);
    background: var(--bg-glass);
    border-radius: var(--radius-md);
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
}

.dropzone:hover, .dropzone.dragover {
    background: var(--bg-glass-hover);
    border-color: #818cf8;
    box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.08);
}

.dropzone-icon {
    font-size: 2.5rem;
    color: #818cf8;
    margin-bottom: 0.5rem;
}

.dropzone-text {
    font-size: 0.9rem;
    color: var(--text-secondary);
}

.dropzone-subtext {
    font-size: 0.75rem;
    color: var(--text-muted);
}

/* Toast Notification */
.toast-container {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.toast {
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid var(--border-subtle);
    border-left: 4px solid var(--color-done);
    color: #0f172a;
    padding: 1rem 1.5rem;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    font-size: 0.85rem;
    font-family: var(--font);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    transform: translateX(120%);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    backdrop-filter: blur(10px);
    max-width: 380px;
}

.toast.show {
    transform: translateX(0);
}

.toast.error {
    border-left-color: var(--color-not-done);
}

.toast-icon {
    font-size: 1.15rem;
}

.toast-message {
    line-height: 1.4;
}

/* ============================================
   Presentation Mode CSS Styles
   ============================================ */
.presentation-page {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 1rem 2rem 0.75rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    height: calc(100vh - 64px);
    overflow: hidden;
    box-sizing: border-box;
}

.slide-details-right {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    flex-shrink: 0;
}

.presentation-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1.25rem;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
    margin-top: auto;
    z-index: 100;
}

.pres-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg-glass);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    padding: 0.5rem 1.25rem;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-family: var(--font);
    font-size: 0.88rem;
    font-weight: 600;
    transition: var(--transition);
}

.pres-btn:hover:not(:disabled) {
    background: var(--bg-glass-hover);
    border-color: var(--border-accent);
    transform: translateY(-1px);
}

.pres-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.pres-dots {
    display: flex;
    gap: 0.75rem;
    align-items: center;
}

.pres-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-muted);
    opacity: 0.3;
    cursor: pointer;
    transition: var(--transition);
}

.pres-dot.active {
    background: var(--module-preksha);
    opacity: 1;
    transform: scale(1.3);
}

.presentation-slide {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Slide 1 Grid layout */
.pres-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 1.5rem;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: 1rem;
}

.pres-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 1.5rem;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    cursor: pointer;
}

.pres-card:hover {
    transform: translateY(-4px);
    border-color: var(--border-accent);
    box-shadow: var(--shadow-lg);
}

.pres-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
}

.pres-card-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
}

.pres-card-body {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
    margin-bottom: 1rem;
}

.pres-kpi-item {
    background: var(--bg-glass);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 0.5rem 0.75rem;
}

.pres-kpi-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
}

.pres-kpi-val {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 0.15rem;
}

/* Horizontal Progress Tracker */
.tracker-container {
    width: 100%;
    overflow-x: auto;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 2.5rem 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow-sm);
}

.tracker-wrapper {
    display: flex;
    justify-content: space-between;
    position: relative;
    min-width: 950px;
    padding: 0 1rem;
}

.tracker-line {
    position: absolute;
    top: 15px;
    left: 40px;
    right: 40px;
    height: 4px;
    background: var(--border-subtle);
    z-index: 1;
}

.tracker-line-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--color-done);
    width: 0%;
    transition: width 0.8s ease;
}

.tracker-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 2;
    width: 80px;
}

.tracker-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg-secondary);
    border: 3px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-muted);
    transition: var(--transition);
}

.tracker-step.done .tracker-dot {
    border-color: var(--color-done);
    background: var(--color-done-bg);
    color: var(--color-done);
}

@keyframes pulse-glow {
    0% {
        box-shadow: 0 0 4px var(--color-progress-bg);
    }
    50% {
        box-shadow: 0 0 14px var(--color-progress);
    }
    100% {
        box-shadow: 0 0 4px var(--color-progress-bg);
    }
}

.tracker-step.in-progress .tracker-dot {
    border-color: var(--color-progress);
    background: var(--color-progress-bg);
    color: var(--color-progress);
    animation: pulse-glow 2s infinite ease-in-out;
}

.tracker-label {
    margin-top: 0.75rem;
    font-size: 0.68rem;
    font-weight: 600;
    text-align: center;
    color: var(--text-muted);
    white-space: normal;
    max-width: 90px;
    line-height: 1.25;
}

.tracker-step.done .tracker-label {
    color: var(--text-primary);
}

.tracker-step.in-progress .tracker-label {
    color: var(--color-progress);
}

/* slide 2-7 specific grids */
.slide-details-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 1.5rem;
    flex: 1;
    min-height: 0;
}

.slide-details-left {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    flex: 1;
    min-height: 0;
}

.pres-user-types-grid {
    display: flex;
    flex-direction: row;
    gap: 1rem;
    flex: 1;
    min-height: 0;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    align-items: stretch;
}

.pres-user-type-card {
    flex: 1;
    min-width: 320px;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 1.25rem;
    height: 100%;
}

.pres-user-type-card-scrollable {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
}

.pres-user-type-card-scrollable::-webkit-scrollbar {
    width: 6px;
}

.pres-user-type-card-scrollable::-webkit-scrollbar-track {
    background: transparent;
}

.pres-user-type-card-scrollable::-webkit-scrollbar-thumb {
    background: rgba(15, 23, 42, 0.1);
    border-radius: 3px;
}

.pres-user-type-card-scrollable::-webkit-scrollbar-thumb:hover {
    background: rgba(15, 23, 42, 0.25);
}

.pres-user-type-card-scrollable .data-table thead th {
    position: sticky;
    top: 0;
    background: var(--bg-secondary);
    z-index: 10;
}

    margin-bottom: 0.05rem;

.presentation-page .hero-title {

}

.presentation-page .pres-kpi-val {

}

.presentation-page .pres-card .progress-bar {

}

.presentation-page .pres-card .progress-label {

/* Slide 2-7 overrides */

}

.presentation-page .slide-details-grid {

    min-height: 0 !important;

}

}

.presentation-page .alert-card .alert-title {

}

.presentation-page .alert-card .alert-body {

}

.dev-review-grid {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    gap: 1rem;
    padding-bottom: 2rem;

    scrollbar-width: thin;

.dev-review-grid > * {
    flex: 0 0 340px;
}

.dev-review-card {
    background: var(--bg-glass);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 0.85rem;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 0.65rem;

}

.dev-review-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.dev-card-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 0.6rem;
}

.dev-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: white;
    flex-shrink: 0;
}

.dev-info {
    flex-grow: 1;
}

.dev-name {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
}

.dev-role {
    font-size: 0.7rem;
    color: var(--text-muted);
}

.dev-utilization {
    text-align: right;
}

.util-val {
    font-size: 1.1rem;
    font-weight: 800;
}

.util-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
}

.dev-metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
}

.dev-metric {
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid var(--border-subtle);
    padding: 0.35rem 0.6rem;
    border-radius: var(--radius-md);
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
}
.dark-mode .dev-metric {
    background: rgba(0, 0, 0, 0.2);
}

.m-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 600;
}

.m-val {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-primary);
}

.m-done {
    color: var(--color-done);
}

.dev-bars-section {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    background: rgba(255,255,255,0.4);
    border-radius: var(--radius-md);
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--border-subtle);
}
.dark-mode .dev-bars-section {
    background: rgba(0,0,0,0.2);
}

.dev-bar-item, .dev-progress-item {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
}

.db-header, .dp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.db-label, .dp-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
}

.db-val, .dp-val {
    font-size: 0.8rem;
    font-weight: 700;
}

.dp-track {
    height: 6px;
    background: rgba(0,0,0,0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 0.2rem;
}
.dark-mode .dp-track { background: rgba(255,255,255,0.1); }

.dp-fill {
    height: 100%;
    background: var(--color-done);
    border-radius: 3px;
}

.dev-remark {

}

function getStatusBadge(status) {
    if (!status || status === '-' || status === '') return '<span class="status-badge status-na">—</span>';
    const s = status.toLowerCase().trim();
    if (s === 'done' || s === 'fixed' || s.startsWith('done')) return `<span class="status-badge status-done">✓ ${status}</span>`;
    if (s === 'approved' || s.startsWith('approved')) return `<span class="status-badge status-approved">✓ ${status}</span>`;
    if (s.includes('in progress') || s.includes('in progress') || s === 'in progress') return `<span class="status-badge status-progress">◐ ${status}</span>`;
    if (s.includes('pending') || s.includes('pending to be reviewed')) return `<span class="status-badge status-pending">◷ ${status}</span>`;
    if (s.includes('not done') || s.includes('not started') || s.includes('not started yet')) return `<span class="status-badge status-not-done">✗ ${status}</span>`;
    if (s.includes('skipped')) return `<span class="status-badge status-skipped">⊘ ${status}</span>`;
    if (s.includes('bug')) return `<span class="status-badge status-bug">⚠ Bug</span>`;
    if (s.includes('reviewed internally')) return `<span class="status-badge status-done">✓ ${status}</span>`;
    if (s.includes('project setup')) return `<span class="status-badge status-progress">◐ ${status}</span>`;
    return `<span class="status-badge status-progress">${status}</span>`;
}

function getPageDotColor(status) {
    if (!status || status === '-') return 'var(--color-na)';
    const s = status.toLowerCase();
    if (s === 'done') return 'var(--color-done)';
    if (s.includes('in progress') || s.includes('project setup')) return 'var(--color-progress)';
    if (s.includes('pending')) return 'var(--color-pending)';
    if (s.includes('not done')) return 'var(--color-not-done)';
    return 'var(--color-na)';
}

function countPages(mod) {
    let count = 0;
    mod.userTypes.forEach(ut => {
        ut.categories.forEach(cat => {
            count += cat.pages.length;
        });
    });
    return count;
}

function countDonePages(mod) {
    let count = 0;
    mod.userTypes.forEach(ut => {
        ut.categories.forEach(cat => {
            cat.pages.forEach(p => {
                if (p.dynamicDev && p.dynamicDev.toLowerCase() === 'done') count++;
            });
        });
    });
    return count;
}

function calculateUserTypeProgress(ut) {
    let total = 0;
    let done = 0;
    ut.categories.forEach(cat => {
        cat.pages.forEach(p => {
            total++;
            if (p.dynamicDev && p.dynamicDev.toLowerCase() === 'done') {
                done++;
            }
        });
    });
    return {
        total,
        done,
        percent: total > 0 ? Math.round((done / total) * 100) : 0
    };
}

function countClientReviewPoints(mod) {
    let count = 0;
    mod.userTypes.forEach(ut => {
        ut.categories.forEach(cat => {
            cat.pages.forEach(p => {
                const r = (p.clientReview && p.clientReview.review) ? p.clientReview.review.trim() : '';
                if (r !== '' && r !== '-' && r.toLowerCase() !== 'none' && r.toLowerCase() !== 'no issues') {
                    count++;
                }
            });
        });
    });
    return count;
}

function countCRs(mod) {
    let count = 0;
    mod.userTypes.forEach(ut => {
        ut.categories.forEach(cat => {
            cat.pages.forEach(p => {
                if (p.changeRequest && p.changeRequest.details && p.changeRequest.details !== 'None' && p.changeRequest.details !== '-') count++;
            });
        });
    });
    return count;
}

function getAvatarColor(name) {
    const colors = ['#6366f1', '#10b981', '#f59e0b', '#f43f5e', '#06b6d4', '#8b5cf6', '#ec4899', '#14b8a6'];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
}

function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function renderTabs() {
    const tabs = [
        { id: 'overview', label: 'Overview', icon: '📋' },
        { id: 'development', label: 'Dynamic Development', icon: '⚡' },
        { id: 'review', label: 'Review', icon: '🔍' },
        { id: 'changes', label: 'Change Requests', icon: '🔄', count: countCRs(currentModule) },
        { id: 'documentation', label: 'Documentation', icon: '📄' },
        { id: 'team', label: 'Team', icon: '👥', count: currentModule.team.length }
    ];

    document.getElementById('tabs-nav').innerHTML = tabs.map(tab => `
        <button class="tab-btn ${currentTab === tab.id ? 'active' : ''}" onclick="switchTab('${tab.id}')" id="tab-${tab.id}">
            ${tab.label}
            ${tab.count !== undefined ? `<span class="tab-count">${tab.count}</span>` : ''}
        </button>
    `).join('');
}

function switchTab(tabId) {
    currentTab = tabId;
    renderTabs();
    renderTabContent();
}

function renderTabContent() {
    const container = document.getElementById('tab-content');
    container.innerHTML = '';

    switch (currentTab) {
        case 'overview': renderOverview(container); break;
        case 'development': renderDevelopment(container); break;
        case 'review': renderReview(container); break;
        case 'changes': renderChanges(container); break;
        case 'documentation': renderDocumentation(container); break;
        case 'team': renderTeam(container); break;
    }
}

        donePagesAll += countDonePages(mod);
    });

    document.getElementById('header-stats').innerHTML = `
        <div class="header-stat">
            <div class="dot" style="background: var(--module-preksha)"></div>
            ${totalModules} Modules
        </div>
        <div class="header-stat">
            <div class="dot" style="background: var(--color-done)"></div>
            ${donePagesAll}/${totalPages} Pages Done
        </div>
    `;
}

function openUploadModal() {
    document.getElementById('upload-modal').classList.add('active');
}

function closeUploadModal() {
    document.getElementById('upload-modal').classList.remove('active');
}

function initUploadListeners() {
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');

    if (!dropzone || !fileInput) return;

    // Trigger file input on click
    dropzone.addEventListener('click', () => {
        fileInput.click();
    });

    // Handle drag over/leave styling
    ['dragenter', 'dragover'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.remove('dragover');
        }, false);
    });

    // Handle dropped file
    dropzone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files && files.length > 0) {
            handleFileUpload(files[0]);
        }
    });

    // Handle selected file
    fileInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files && files.length > 0) {
            handleFileUpload(files[0]);
        }
    });
}

function handleFileUpload(file) {
    if (!file) return;

    // Check file extension
    const name = file.name.toLowerCase();
    if (!name.endsWith('.xlsx') && !name.endsWith('.xls') && !name.endsWith('.csv')) {
        showToast('Please upload a valid Excel or CSV file (.xlsx, .xls, .csv)', 'error');
        return;
    }

    if (typeof XLSX === 'undefined') {
        showToast('SheetJS library not loaded. Please connect to the internet and try again.', 'error');
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            const parsed = parseExcelToModules(workbook);
            
            if (Object.keys(parsed).length === 0) {
                showToast('No module data could be parsed from this file. Check the format.', 'error');
                return;
            }

            // Update global MODULES
            MODULES = parsed;
            localStorage.setItem('project_dashboard_modules', JSON.stringify(MODULES));
            
            // Re-render
            renderHeaderStats();
            showLanding();
            
            // Calculate statistics for the toast
            let moduleCount = Object.keys(parsed).length;
            let pageCount = 0;
            Object.values(parsed).forEach(m => {
                m.userTypes.forEach(ut => {
                    ut.categories.forEach(c => {
                        pageCount += c.pages.length;
                    });
                });
            });

            showToast(`Dashboard updated! Loaded ${moduleCount} modules and ${pageCount} pages.`, 'success');
            closeUploadModal();
        } catch (error) {
            console.error(error);
            showToast('Error reading or parsing file: ' + error.message, 'error');
        }
    };
    
    reader.onerror = function() {
        showToast('Error reading file.', 'error');
    };

    reader.readAsArrayBuffer(file);
}

function resetToDefault() {
    if (confirm('Are you sure you want to reset all data back to defaults? This will erase any uploaded spreadsheet updates.')) {
        localStorage.removeItem('project_dashboard_modules');
        MODULES = DEFAULT_MODULES;
        renderHeaderStats();
        showLanding();
        showToast('Reset dashboard data to hardcoded defaults.', 'success');
        closeUploadModal();
    }
}

// Helper: Parse comma/slash-separated team members
function parseTeam(val) {
    if (!val) return [];
    const str = val.toString().trim();
    if (str === '' || str === '-' || str.toLowerCase() === 'none') return [];
    
    // Split by comma, slash, and, semicolon
    const parts = str.split(/[,/\&;]|\band\b/i);
    return parts
        .map(p => p.trim())
        .filter(p => p !== '' && p !== '-');
}

// Helper: Map module names to IDs
function getModuleId(name) {
    const n = name.toLowerCase().trim();
    if (n.includes('preksha')) return 'preksha';
    if (n.includes('samadhan') || n.includes('grievance')) return 'samadhan';
    if (n.includes('expenditure') || n.includes('expense')) return 'expenditure';
    if (n.includes('sugamta') || n.includes('route')) return 'sugamta';
    if (n.includes('pithasin') || n.includes('polling') || n.includes('ipbms')) return 'ipbms';
    if (n.includes('evm')) return 'evm';
    
    // Fallback: slugify name
    return name.toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '');
}

const EXISTING_VISUALS = {

    samadhan: { color: '#10b981', icon: 'स' },
    expenditure: { color: '#f59e0b', icon: 'व्य' },

};

let colorIndex = 0;

function getVisuals(moduleId, name) {

        return EXISTING_VISUALS[moduleId];
    }
    const color = PRESET_COLORS[colorIndex % PRESET_COLORS.length];

// Heuristic: Check if row is a category header
function isCategoryHeader(row, colIdx) {
    const pageVal = (row[colIdx.pages] || '').toString().trim();
    if (!pageVal) return false;
    
    const devVal = (row[colIdx.dynamicDev] || '').toString().trim();
    const isEmptyOrHyphen = (val) => val === '' || val === '-';
    
    // Precise check for category names
    const pName = pageVal.toLowerCase();
    const categories = [
        'profile', 'main pages', 'reports', 'other pages', 'dashboard & management',
        'route planning', 'vehicle requisition', 'vehicle management', 'scanning',
        'registration', 'complaint management', 'user management', 'application & reports',
        'core'
    ];
    if (categories.some(cat => pName === cat || pName.startsWith(cat))) {
        return true;
    }
    
    const intRevVal = (row[colIdx.internalReviewReview] || '').toString().trim();
    const intStatusVal = (row[colIdx.internalReviewStatus] || '').toString().trim();
    const cliRevVal = (row[colIdx.clientReviewReview] || '').toString().trim();
    const cliStatusVal = (row[colIdx.clientReviewStatus] || '').toString().trim();
    
    const reqVal = (row[colIdx.reqGathering] || '').toString().trim();
    const finalVal = (row[colIdx.finalStatus] || '').toString().trim();
    
    // Category headers are typically blank in almost all other fields
    if (isEmptyOrHyphen(devVal) && isEmptyOrHyphen(intRevVal) && isEmptyOrHyphen(intStatusVal) && 
        isEmptyOrHyphen(cliRevVal) && isEmptyOrHyphen(cliStatusVal) && 
        isEmptyOrHyphen(reqVal) && isEmptyOrHyphen(finalVal)) {
        return true;
    }
    
    return false;
}

function parseTimeToDays(str) {
    if (!str) return [0, 0];
    const s = str.toString().toLowerCase().trim();
    const clean = s.replace(/[^a-z]/g, '');
    if (clean === '' || clean === 'na' || clean === 'none' || clean === 'notapplicable' || clean === 'notavailable') {
        return [0, 0];
    }
    const matches = s.match(/\d+/g);
    if (!matches || matches.length === 0) {
        return [0, 0];
    }
    if (matches.length >= 2) {
        const min = parseInt(matches[0], 10);
        const max = parseInt(matches[1], 10);
        return [min, max];
    } else {
        const val = parseInt(matches[0], 10);
        return [val, val];
    }
}

// Excel data parser
function parseExcelToModules(workbook) {
    const sheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

    if (rows.length === 0) {
        throw new Error('Workbook sheet is empty');
    }

    // Find header row by scanning for "Pages"
    let headerRowIndex = -1;
    for (let r = 0; r < Math.min(rows.length, 10); r++) {
        const row = rows[r];
        if (row && row.some(cell => cell && cell.toString().toLowerCase().trim() === 'pages')) {
            headerRowIndex = r;
            break;
        }
    }

    if (headerRowIndex === -1) {
        headerRowIndex = 1; // Default fallback to index 1 (row 2 in excel)
    }

    // Default mapping (Columns A to W)
    let colIdx = {
        module: 0,
        userType: 1,
        pages: 2,
        reqGathering: 3,
        staticScreensCreation: 4,
        staticScreensPresentation: 5,
        staticScreensStatus: 6,
        dynamicDev: 7,
        internalReviewReview: 8,
        internalReviewStatus: 9,
        clientReviewReview: 10,
        clientReviewStatus: 11,
        crDetails: 12,
        crDevStatus: 13,
        crClientReview: 14,
        crApproval: 15,
        finalStatus: 16,
        remark: 17,
        dependency: 18,
        docProcessFlow: 19,
        docUserManual: 20,
        team: 21,
        timeNeeded: 22
    };

    // Generate combined headers to handle multi-row and merged group headers
    const row1 = rows[headerRowIndex] || [];
    const row2 = rows[headerRowIndex + 1] || [];
    const row3 = rows[headerRowIndex + 2] || [];
    const combinedHeaders = [];
    const maxCols = Math.max(row1.length, row2.length, row3.length);
    
    let group1 = '';
    let group2 = '';
    for (let c = 0; c < maxCols; c++) {
        const val1 = (row1[c] || '').toString().trim();
        if (val1 !== '') {
            group1 = val1;
            group2 = ''; // Reset group2 when a new group1 starts
        }
        const val2 = (row2[c] || '').toString().trim();
        if (val2 !== '') {
            group2 = val2;
        }
        const val3 = (row3[c] || '').toString().trim();
        
        let parts = [];
        if (group1) parts.push(group1);
        if (group2 && group2.toLowerCase() !== group1.toLowerCase()) parts.push(group2);
        if (val3 && val3.toLowerCase() !== (group2 || group1).toLowerCase()) parts.push(val3);
        
        combinedHeaders.push(parts.join(' ').toLowerCase().trim());
    }

    // Attempt to map headers based on keywords
    combinedHeaders.forEach((s, idx) => {
        if (s.includes('module')) colIdx.module = idx;
        else if (s.includes('user type') || s.includes('usertype')) colIdx.userType = idx;
        else if (s === 'pages' || s === 'page' || s.includes('page name')) colIdx.pages = idx;
        else if ((s.includes('requirement') || s.includes('requiement') || s.includes('requiemernt')) && !s.includes('change') && !s.includes('cr') && !s.includes('new') && !s.includes('approval')) colIdx.reqGathering = idx;
        else if (s.includes('static') && s.includes('creation')) colIdx.staticScreensCreation = idx;
        else if (s.includes('static') && s.includes('presentation')) colIdx.staticScreensPresentation = idx;
        else if (s.includes('static') && s.includes('status')) colIdx.staticScreensStatus = idx;
        else if (s.includes('dynamic') && !s.includes('status') && !s.includes('review') && !s.includes('detail') && !s.includes('approval') && !s.includes('cr')) colIdx.dynamicDev = idx;
        else if (s.includes('internal') && s.includes('review') && !s.includes('status') && !s.includes('change') && !s.includes('cr') && !s.includes('new') && !s.includes('approval')) colIdx.internalReviewReview = idx;
        else if (s.includes('internal') && s.includes('status') && !s.includes('change') && !s.includes('cr') && !s.includes('new') && !s.includes('approval')) colIdx.internalReviewStatus = idx;
        else if (s.includes('client') && s.includes('review') && !s.includes('status') && !s.includes('change') && !s.includes('cr') && !s.includes('new') && !s.includes('approval')) colIdx.clientReviewReview = idx;
        else if (s.includes('client') && s.includes('status') && !s.includes('change') && !s.includes('cr') && !s.includes('new') && !s.includes('approval')) colIdx.clientReviewStatus = idx;
        else if (s.includes('cr') && s.includes('detail')) colIdx.crDetails = idx;
        else if (s.includes('cr') && s.includes('dev')) colIdx.crDevStatus = idx;
        else if (s.includes('cr') && s.includes('client')) colIdx.crClientReview = idx;
        else if (s.includes('cr') && s.includes('approval')) colIdx.crApproval = idx;
        else if (s.includes('final') && s.includes('status')) colIdx.finalStatus = idx;
        else if (s.includes('remark')) colIdx.remark = idx;
        else if (s.includes('dependency') || s.includes('blocker')) colIdx.dependency = idx;
        else if (s.includes('process') && s.includes('flow')) colIdx.docProcessFlow = idx;
        else if (s.includes('user') && s.includes('manual')) colIdx.docUserManual = idx;
        else if (s.includes('team') || s.includes('developer') || s === 'dev') colIdx.team = idx;
        else if (s.includes('time') || s.includes('duration') || s.includes('need')) colIdx.timeNeeded = idx;
    });

    const parsedModules = {};
    const dataStartRowIndex = headerRowIndex + 3;
    let currentModuleName = '';
    let currentUserTypeName = '';
    let currentCategoryName = 'General';
    let lastUserTypeName = '';

    let inheritedProps = null;

    for (let r = dataStartRowIndex; r < rows.length; r++) {
        const row = rows[r];
        if (!row) continue;

        // Merged cells carrying forward values
        const moduleVal = row[colIdx.module];
        const userTypeVal = row[colIdx.userType];
        const pageVal = row[colIdx.pages];

        if (moduleVal && moduleVal.toString().trim() !== '') {
            currentModuleName = moduleVal.toString().trim();
        }
        if (userTypeVal && userTypeVal.toString().trim() !== '') {
            currentUserTypeName = userTypeVal.toString().trim();
        }

        const id = getModuleId(currentModuleName);
        if (!parsedModules[id]) {
            const visuals = getVisuals(id, currentModuleName);
            parsedModules[id] = {
                id: id,
                name: currentModuleName,
                icon: visuals.icon,
                color: visuals.color,
                requirementGathering: row[colIdx.reqGathering] || '-',
                staticScreens: {
                    creation: row[colIdx.staticScreensCreation] || '-',
                    presentation: row[colIdx.staticScreensPresentation] || '-',
                    status: row[colIdx.staticScreensStatus] || '-'
                },
                finalStatus: row[colIdx.finalStatus] || '-',
                remark: row[colIdx.remark] || '',
                dependency: row[colIdx.dependency] || '',
                clientReviewPoints: (MODULES[id] && MODULES[id].clientReviewPoints) ? [...MODULES[id].clientReviewPoints] : [],
                documentation: {
                    processFlow: row[colIdx.docProcessFlow] || '-',
                    userManual: row[colIdx.docUserManual] || '-',
                    conceptNote: '-'
                },
                team: parseTeam(row[colIdx.team]),
                timeNeeded: row[colIdx.timeNeeded] || '',
                userTypes: []
            };
        }

        const mod = parsedModules[id];

        // Update module level fields if they were '-' but now have values
        if (row[colIdx.reqGathering] && mod.requirementGathering === '-') mod.requirementGathering = row[colIdx.reqGathering];
        if (row[colIdx.staticScreensCreation] && mod.staticScreens.creation === '-') mod.staticScreens.creation = row[colIdx.staticScreensCreation];
        if (row[colIdx.staticScreensPresentation] && mod.staticScreens.presentation === '-') mod.staticScreens.presentation = row[colIdx.staticScreensPresentation];
        if (row[colIdx.staticScreensStatus] && mod.staticScreens.status === '-') mod.staticScreens.status = row[colIdx.staticScreensStatus];
        if (row[colIdx.finalStatus] && mod.finalStatus === '-') mod.finalStatus = row[colIdx.finalStatus];
        if (row[colIdx.remark] && mod.remark === '') mod.remark = row[colIdx.remark];
        if (row[colIdx.dependency] && mod.dependency === '') mod.dependency = row[colIdx.dependency];
        if (row[colIdx.docProcessFlow] && mod.documentation.processFlow === '-') mod.documentation.processFlow = row[colIdx.docProcessFlow];
        if (row[colIdx.docUserManual] && mod.documentation.userManual === '-') mod.documentation.userManual = row[colIdx.docUserManual];
        if (row[colIdx.timeNeeded] && mod.timeNeeded === '') mod.timeNeeded = row[colIdx.timeNeeded];

        const newTeam = parseTeam(row[colIdx.team]);
        newTeam.forEach(member => {
            if (!mod.team.includes(member)) mod.team.push(member);
        });

        // Project setup check
        if (pageVal) {
            const pageName = pageVal.toString().trim();
            if (pageName !== '' && pageName.toLowerCase() === 'project setup') {
                mod.projectSetup = row[colIdx.dynamicDev] || 'Not started';
                continue;
            }
        }

        if (!currentUserTypeName) {
            continue; // Skip until we have both contexts
        }

        // Find or create user type
        let ut = mod.userTypes.find(u => u.name === currentUserTypeName);
        if (!ut) {
            ut = {
                name: currentUserTypeName,
                reqGathering: row[colIdx.reqGathering] || '-',
                staticScreens: {
                    creation: row[colIdx.staticScreensCreation] || '-',
                    presentation: row[colIdx.staticScreensPresentation] || '-',
                    status: row[colIdx.staticScreensStatus] || '-'
                },
                timeNeeded: row[colIdx.timeNeeded] || '-',
                categories: []
            };
            mod.userTypes.push(ut);
        } else {
            if (row[colIdx.reqGathering] && ut.reqGathering === '-') ut.reqGathering = row[colIdx.reqGathering];
            if (row[colIdx.staticScreensCreation] && ut.staticScreens.creation === '-') ut.staticScreens.creation = row[colIdx.staticScreensCreation];
            if (row[colIdx.staticScreensPresentation] && ut.staticScreens.presentation === '-') ut.staticScreens.presentation = row[colIdx.staticScreensPresentation];
            if (row[colIdx.staticScreensStatus] && ut.staticScreens.status === '-') ut.staticScreens.status = row[colIdx.staticScreensStatus];
            if (row[colIdx.timeNeeded] && ut.timeNeeded === '-') ut.timeNeeded = row[colIdx.timeNeeded];
        }

        // Reset category if user type changes
        if (currentUserTypeName !== lastUserTypeName) {
            currentCategoryName = 'General';
            lastUserTypeName = currentUserTypeName;
        }

        if (!pageVal) continue;
        const pageName = pageVal.toString().trim();
        if (pageName === '') continue;

        // Category header detection
        if (isCategoryHeader(row, colIdx)) {
            currentCategoryName = pageName;
            
            // Check if the category header row accidentally contains data due to merged cells
            const devVal = (row[colIdx.dynamicDev] || '').toString().trim();
            if (devVal && devVal !== '-') {
                inheritedProps = row;
            }
            continue;
        }

        // Find or create category in this user type
        let cat = ut.categories.find(c => c.name === currentCategoryName);
        if (!cat) {
            cat = {
                name: currentCategoryName,
                pages: []
            };
            ut.categories.push(cat);
        }

        // Parse page properties
        const activeRow = inheritedProps || row;
        const page = {
            name: pageName,
            dynamicDev: activeRow[colIdx.dynamicDev] || (row[colIdx.dynamicDev] || '-'),
            internalReview: {
                review: activeRow[colIdx.internalReviewReview] || (row[colIdx.internalReviewReview] || '-'),
                status: activeRow[colIdx.internalReviewStatus] || (row[colIdx.internalReviewStatus] || '-')
            },
            clientReview: {
                review: activeRow[colIdx.clientReviewReview] || (row[colIdx.clientReviewReview] || '-'),
                status: activeRow[colIdx.clientReviewStatus] || (row[colIdx.clientReviewStatus] || '-')
            },
            changeRequest: null
        };

        const crDetails = (activeRow[colIdx.crDetails] || (row[colIdx.crDetails] || '')).toString().trim();
        if (crDetails && crDetails !== '-' && crDetails !== '') {
            page.changeRequest = {
                details: crDetails,
                devStatus: activeRow[colIdx.crDevStatus] || (row[colIdx.crDevStatus] || '-'),
                clientReview: activeRow[colIdx.crClientReview] || (row[colIdx.crClientReview] || '-'),
                approval: activeRow[colIdx.crApproval] || (row[colIdx.crApproval] || '-')
            };
        }

        inheritedProps = null;

        cat.pages.push(page);
    }

    // Filter out empty categories and calculate dynamic timeNeeded sums
    Object.values(parsedModules).forEach(mod => {
        mod.userTypes.forEach(ut => {
            ut.categories = ut.categories.filter(c => c.pages.length > 0);
        });

        // Sum user type time estimations
        let totalMin = 0;
        let totalMax = 0;
        let anyUserTypeTimeSet = false;

        mod.userTypes.forEach(ut => {
            if (ut.timeNeeded && ut.timeNeeded !== '-') {
                const [min, max] = parseTimeToDays(ut.timeNeeded);
                if (min > 0 || max > 0) {
                    totalMin += min;
                    totalMax += max;
                    anyUserTypeTimeSet = true;
                }
            }
        });

        if (anyUserTypeTimeSet) {
            if (totalMin === totalMax) {
                mod.timeNeeded = `${totalMin} day${totalMin !== 1 ? 's' : ''}`;
            } else {
                mod.timeNeeded = `${totalMin}-${totalMax} days`;
            }
        } else if (mod.timeNeeded === '' || mod.timeNeeded === '-') {
            mod.timeNeeded = 'NA';
        }
    });

    return parsedModules;
}

// Toast notification helper
function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    if (!container) return;
    
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    
    const icon = type === 'success' ? '✓' : '⚠';
    
    toast.innerHTML = `
        <span class="toast-icon">${icon}</span>
        <span class="toast-message">${message}</span>
    `;
    
    container.appendChild(toast);
    
    // Trigger entry transition
    setTimeout(() => {
        toast.classList.add('show');
    }, 10);
    
    // Remove after 4s
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
            toast.remove();
        }, 300);
    }, 4000);
}

function countInternalReviewPoints(mod) {
    let count = 0;
    mod.userTypes.forEach(ut => {
        ut.categories.forEach(cat => {
            cat.pages.forEach(p => {
                const r = (p.internalReview.review || '').trim();
                if (r !== '' && r !== '-' && r.toLowerCase() !== 'none' && r.toLowerCase() !== 'no issues') {
                    count++;
                }
            });
        });
    });
    return count;
}

function getInternalReviewStatus(mod) {
    let hasInProgress = false;
    let hasPending = false;
    let hasDone = false;
    let pointsCount = 0;
    
    mod.userTypes.forEach(ut => {
        ut.categories.forEach(cat => {
            cat.pages.forEach(p => {
                const r = (p.internalReview.review || '').trim();
                const s = (p.internalReview.status || '').toLowerCase().trim();
                
                if (r !== '' && r !== '-' && r.toLowerCase() !== 'none' && r.toLowerCase() !== 'no issues') {
                    pointsCount++;
                    if (s.includes('progress')) hasInProgress = true;
                    else if (s.includes('pending')) hasPending = true;
                    else if (s.includes('done') || s.includes('approved')) hasDone = true;
                }
            });
        });
    });
    
    if (pointsCount === 0) return 'Done';
    if (hasInProgress) return 'In Progress';
    if (hasPending) return 'Pending';
    if (hasDone) return 'Done';
    return 'In Progress';
}

function getClientReviewStatus(mod) {
    let hasInProgress = false;
    let hasPending = false;
    let hasDone = false;
    let pointsCount = 0;
    
    mod.userTypes.forEach(ut => {
        ut.categories.forEach(cat => {
            cat.pages.forEach(p => {
                const r = (p.clientReview && p.clientReview.review) ? p.clientReview.review.trim() : '';
                const s = (p.clientReview && p.clientReview.status) ? p.clientReview.status.trim().toLowerCase() : '';
                
                if (r !== '' && r !== '-' && r.toLowerCase() !== 'none' && r.toLowerCase() !== 'no issues') {
                    pointsCount++;
                    if (s.includes('progress')) hasInProgress = true;
                    else if (s.includes('pending')) hasPending = true;
                    else if (s.includes('done') || s.includes('approved')) hasDone = true;
                }
            });
        });
    });
    
    if (pointsCount === 0) return 'Done';
    if (hasInProgress) return 'In Progress';
    if (hasPending) return 'Pending';
    if (hasDone) return 'Approved';
    return 'In Progress';
}

function getStepStatus(mod, stepName) {
    const finalDone = mod.finalStatus && mod.finalStatus.toLowerCase().trim() === 'done';
    
    switch (stepName) {
        case 'Requirement Gathering':
            const req = (mod.requirementGathering || '').toLowerCase().trim();
            if (req === 'done' || req.includes('complete')) return 'done';
            if (req.includes('progress') || req.includes('started')) return 'in-progress';
            return 'not-started';
        case 'Static screens':
            const sc = (mod.staticScreens.status || '').toLowerCase().trim();
            if (sc === 'done' || sc.includes('complete') || sc.includes('reviewed') || sc.includes('approved')) return 'done';
            if (sc.includes('progress') || sc.includes('started') || sc.includes('partial')) return 'in-progress';
            return 'not-started';
        case 'Dynamic Development':
            const devTotal = countPages(mod);
            const devDone = countDonePages(mod);
            if (devTotal > 0 && devDone === devTotal) return 'done';
            if (devDone > 0) return 'in-progress';
            return 'not-started';
        case 'Internal review':
            let intTotal = 0;
            let intDoneCount = 0;
            let intNotStartedCount = 0;
            mod.userTypes.forEach(ut => {
                ut.categories.forEach(cat => {
                    cat.pages.forEach(p => {
                        intTotal++;
                        const s = (p.internalReview.status || '').toLowerCase().trim();
                        const r = (p.internalReview.review || '').toLowerCase().trim();
                        if (s === 'done' || s === 'fixed' || r === 'no issues') {
                            intDoneCount++;
                        } else if (s === '-' && (r === '-' || r === '')) {
                            intNotStartedCount++;
                        }
                    });
                });
            });
            if (intTotal > 0 && intDoneCount === intTotal) return 'done';
            if (intNotStartedCount === intTotal) return 'not-started';
            return 'in-progress';
        case 'Client review':
            let clTotal = 0;
            let clDoneCount = 0;
            let clNotStartedCount = 0;
            mod.userTypes.forEach(ut => {
                ut.categories.forEach(cat => {
                    cat.pages.forEach(p => {
                        clTotal++;
                        const s = (p.clientReview.status || '').toLowerCase().trim();
                        const r = (p.clientReview.review || '').toLowerCase().trim();
                        if (s === 'approved' || s === 'done') {
                            clDoneCount++;
                        } else if (s === '-' && (r === '-' || r === '')) {
                            clNotStartedCount++;
                        }
                    });
                });
            });
            if (clTotal > 0 && clDoneCount === clTotal) return 'done';
            if (clNotStartedCount === clTotal) return 'not-started';
            return 'in-progress';
        case 'QA':
            if (finalDone) return 'done';
            if (getStepStatus(mod, 'Client review') === 'done') return 'in-progress';
            return 'not-started';
        case 'Final Review':
            if (finalDone) return 'done';
            if (getStepStatus(mod, 'QA') === 'done') return 'in-progress';
            return 'not-started';
        case 'Security implementation':
            if (finalDone) return 'done';
            if (getStepStatus(mod, 'Final Review') === 'done') return 'in-progress';
            return 'not-started';
        case 'UAT':
            if (finalDone) return 'done';
            if (getStepStatus(mod, 'Security implementation') === 'done') return 'in-progress';
            return 'not-started';
        case 'Go Live':
            if (finalDone) return 'done';
            if (getStepStatus(mod, 'UAT') === 'done') return 'in-progress';
            return 'not-started';
        default:
            return 'not-started';
    }
}

function togglePresentationMode() {
    presentationMode = !presentationMode;
    const btn = document.getElementById('pres-toggle-btn');
    const presPage = document.getElementById('presentation-page');
    const landingPage = document.getElementById('landing-page');
    const detailPage = document.getElementById('detail-page');
    const backBtn = document.getElementById('back-btn');
    const pageTitle = document.getElementById('page-title');
    const uploadBtn = document.getElementById('upload-btn');

    if (presentationMode) {
        document.body.style.overflow = 'hidden';
        btn.innerHTML = '<span>📊 Dashboard Mode</span>';
        btn.style.background = 'rgba(16, 185, 129, 0.12)';
        btn.style.color = '#10b981';
        btn.style.borderColor = 'rgba(16, 185, 129, 0.25)';

        landingPage.classList.add('hidden');
        detailPage.classList.add('hidden');
        backBtn.classList.add('hidden');
        pageTitle.classList.remove('hidden');
        if (uploadBtn) uploadBtn.classList.add('hidden');
        presPage.classList.remove('hidden');

        // Context-aware slide index
        if (currentModule) {
            const idx = MODULE_ORDER.indexOf(currentModule.id);
            currentSlideIndex = idx !== -1 ? idx + 1 : 0;
        } else {
            currentSlideIndex = 0;
        }
        renderSlide();
    } else {
        document.body.style.overflow = '';
        btn.innerHTML = '<span>🎬 Presentation Mode</span>';
        btn.style.background = 'rgba(99, 102, 241, 0.12)';
        btn.style.color = '#4f46e5';
        btn.style.borderColor = 'rgba(99, 102, 241, 0.25)';

        presPage.classList.add('hidden');
        if (uploadBtn) uploadBtn.classList.remove('hidden');
        
        if (currentSlideIndex >= 1 && currentSlideIndex <= MODULE_ORDER.length) {
            const mid = MODULE_ORDER[currentSlideIndex - 1];
            showModule(mid);
        } else if (currentSlideIndex === MODULE_ORDER.length + 1) {
            showTeamReview();
        } else {
            showLanding();
        }
    }
}

function prevSlide() {
    if (!presentationMode) return;
    if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide();
    }
}

function nextSlide() {
    if (!presentationMode) return;
    if (currentSlideIndex < MODULE_ORDER.length + 3) {
        currentSlideIndex++;
        renderSlide();
    }
}

function goToSlide(index) {
    if (!presentationMode) return;
    currentSlideIndex = index;

}
